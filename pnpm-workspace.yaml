packages:
   - frontend
   - server-ts
   - packages/plugin-sdk
   - apps/mobile
   - apps/desktop

# pnpm 12 reads these here, not from package.json's "pnpm" field.
allowBuilds:
   '@biomejs/biome': true
   '@google/genai': true
   '@parcel/watcher': true
   '@swc/core': true
   better-sqlite3: true
   electron: true
   electron-builder: true
   electron-winstaller: true
   esbuild: true
   koffi: true
   msw: true
   node-llama-cpp: true
   protobufjs: true
   sharp: true
   tree-sitter-go: true
   tree-sitter-javascript: true
   tree-sitter-python: true
   tree-sitter-rust: true
   tree-sitter-typescript: true
   unrs-resolver: true
   workerd: true

minimumReleaseAgeExclude:
  - '@github/copilot-sdk-darwin-arm64@1.0.18'
  - '@github/copilot-sdk-darwin-x64@1.0.18'
  - '@github/copilot-sdk-linux-arm64@1.0.18'
  - '@github/copilot-sdk-linux-x64@1.0.18'
  - '@github/copilot-sdk-linuxmusl-arm64@1.0.18'
  - '@github/copilot-sdk-linuxmusl-x64@1.0.18'
  - '@github/copilot-sdk-win32-arm64@1.0.18'
  - '@github/copilot-sdk-win32-x64@1.0.18'
  - '@github/copilot-sdk@1.0.18'

patchedDependencies:
  '@electric-sql/pglite-socket@0.2.11': patches/@electric-sql__pglite-socket@0.2.11.patch

peerDependencyRules:
   allowedVersions:
      'eslint-plugin-import>eslint': '10'
      'eslint-plugin-jsx-a11y>eslint': '10'
      'eslint-plugin-react>eslint': '10'
      '@tobilu/qmd>typescript': '7'
