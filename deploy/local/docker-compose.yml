# Berry for local development, in one command:  pnpm dev:docker
#
# Four services run from the working tree with their watchers on, so an edit
# on the Mac restarts the API or reloads the page as it does today:
#
#   web       next dev          http://localhost:3000
#   api       node --watch      http://localhost:4000   (previews at *.preview.localhost:4000)
#   sessions  the session router, one container per agent session
#   postgres  PostgreSQL 16     inside the compose network (not the Mac's)
#
# It uses the repository's own .env for everything except DATABASE_URL, which
# the api service points at this file's postgres. The Mac database is untouched.
# deploy/local/start.sh says what is adjusted for running inside a container.

name: berry-dev

x-dev: &dev
   build:
      context: .
      dockerfile: dev.Dockerfile
   env_file: ../../.env
   extra_hosts:
      - 'host.docker.internal:host-gateway'
   init: true
   environment: &dev-env
      # pnpm's package store, in a volume: left to itself pnpm puts it beside the
      # project, which here is the working tree on the Mac.
      npm_config_store_dir: /pnpm-store

services:
   postgres:
      image: postgres:16
      environment:
         POSTGRES_USER: berry
         POSTGRES_DB: berry
         POSTGRES_PASSWORD: berry
      volumes:
         - postgres:/var/lib/postgresql/data
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U berry -d berry']
         interval: 5s
         timeout: 3s
         retries: 20

   api:
      <<: *dev
      command: ['bash', 'deploy/local/start.sh', 'api']
      environment:
         <<: *dev-env
         API_ADDR: 0.0.0.0:4000
         HOME: /root
         # Overrides .env so this stack does not share the Mac's database.
         DATABASE_URL: postgres://berry:berry@postgres:5432/berry?sslmode=disable
         BERRY_AGENT_RUNTIME_URL: http://sessions:8080
         # This stack's web container is published on :3000 regardless of the
         # host .env's BERRY_APP_URL (which defaults to :3100 for `pnpm
         # dev:frontend`), so sign-in redirects land on the right origin.
         BERRY_APP_URL: http://localhost:3000
         # A preview's checkout is mounted into its containers by the Mac's
         # Docker, so it has to be at the same path in here as it is out there.
         BERRY_PREVIEW_ROOT: ${HOME}/.cache/berry/previews
      ports:
         - '127.0.0.1:4000:4000'
      volumes:
         - ../..:/repo
         - server-modules:/repo/server-ts/node_modules
         - pnpm-store:/pnpm-store
         - /var/run/docker.sock:/var/run/docker.sock
         - ${HOME}/.cache/berry/previews:${HOME}/.cache/berry/previews
      depends_on:
         postgres: { condition: service_healthy }
         sessions: { condition: service_started }

   sessions:
      <<: *dev
      command: ['bash', 'deploy/local/start.sh', 'sessions']
      environment:
         <<: *dev-env
         BERRY_ROUTER_IMAGE: berry-agent-runtime
         BERRY_ROUTER_LISTEN_HOST: 0.0.0.0
         BERRY_RUNTIME_PORT: '8080'
      ports:
         # Also on the host at localhost:8080. The api service uses http://sessions:8080.
         - '127.0.0.1:8080:8080'
      volumes:
         - ../..:/repo
         - /var/run/docker.sock:/var/run/docker.sock
      depends_on:
         runtime-image: { condition: service_completed_successfully }

   # Not a service: it builds the image agent sessions start from, under the
   # name the router looks for, and exits.
   runtime-image:
      build:
         context: ../../server-ts
         dockerfile: sandbox/agentcore/Dockerfile
         args:
            # arm64 is an Apple Silicon Mac. On an Intel Mac: BERRY_RUNTIME_PLATFORM=linux/amd64 pnpm dev:docker
            BERRY_RUNTIME_PLATFORM: ${BERRY_RUNTIME_PLATFORM:-linux/arm64}
      image: berry-agent-runtime
      entrypoint: ['true']
      restart: 'no'
      network_mode: none

   web:
      <<: *dev
      command: ['bash', 'deploy/local/start.sh', 'web']
      environment:
         <<: *dev-env
         BERRY_API_ORIGIN: http://api:4000
         # The host's `pnpm dev:frontend` binds :3100 by default (PORT env var)
         # so it does not collide with other local projects; this container
         # keeps :3000 since nothing else shares its network namespace.
         PORT: '3000'
         # Its own build folder: the Mac's .next holds files built for macOS.
         NEXT_DIST_DIR: .next-docker
         NEXT_TELEMETRY_DISABLED: '1'
      ports:
         - '127.0.0.1:3000:3000'
      volumes:
         - ../..:/repo
         - root-modules:/repo/node_modules
         - web-modules:/repo/frontend/node_modules
         - sdk-modules:/repo/packages/plugin-sdk/node_modules
         - web-server-modules:/repo/server-ts/node_modules
         - pnpm-store:/pnpm-store
      depends_on: [api]

volumes:
   postgres:
   pnpm-store:
   server-modules:
   root-modules:
   web-modules:
   sdk-modules:
   web-server-modules:
