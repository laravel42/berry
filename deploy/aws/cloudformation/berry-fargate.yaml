AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Berry control plane on ECS Fargate. Application Load Balancer in front of one
  task that runs the API (:4000) and the web app (:3000). Postgres is an existing
  Aurora/RDS cluster with IAM database authentication (no password in the task).
  The task role mints tokens. This stack does not expose the database and does
  not run preview or session containers (those need the EC2 Docker host in
  deploy/aws).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Database (existing Aurora / RDS)
        Parameters:
          - DatabaseUrl
          - DbClusterResourceId
          - DatabaseUser
      - Label:
          default: Images
        Parameters:
          - ApiImage
          - WebImage
          - CpuArchitecture
          - DesiredCount
      - Label:
          default: Address
        Parameters:
          - DomainName
          - CertificateArn
      - Label:
          default: Optional
        Parameters:
          - AgentCoreRuntimeArn
          - VpcCidr

Parameters:
  DatabaseUrl:
    Type: String
    AllowedPattern: '^postgres(ql)?://.+'
    Description: >-
      postgres://user@host:5432/dbname with no password. IAM auth supplies the
      token per connection.

  DbClusterResourceId:
    Type: String
    AllowedPattern: '^cluster-[A-Z0-9]+$'
    Description: >-
      Aurora/RDS cluster resource id (not the cluster name). From
      describe-db-clusters DbClusterResourceId. Used in rds-db:connect.

  DatabaseUser:
    Type: String
    Default: postgres
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]*$'
    Description: IAM database user that has been GRANT rds_iam.

  ApiImage:
    Type: String
    Default: ''
    Description: >-
      API image URI (ECR). Empty uses this stack's api repository :latest. Push
      before raising DesiredCount above 0.

  WebImage:
    Type: String
    Default: ''
    Description: >-
      Web image URI. Empty uses this stack's web repository :latest. Build with
      BERRY_API_ORIGIN=http://127.0.0.1:4000 so Next rewrites to the API sidecar.

  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues:
      - ARM64
      - X86_64
    Description: Must match the image platform (linux/arm64 or linux/amd64).

  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 8
    Description: >-
      Start at 0 so the stack can create ECR repositories before any image
      exists. Set to 1 after you push.

  DomainName:
    Type: String
    Default: ''
    Description: Browser origin host, e.g. berry.example.com. Empty uses the ALB DNS name.

  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate in this region. Empty serves HTTP on port 80 only.

  AgentCoreRuntimeArn:
    Type: String
    Default: ''
    Description: Optional BERRY_AGENTCORE_RUNTIME_ARN. Empty omits AgentCore IAM.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: CIDR for the VPC this stack creates (public subnets, no NAT).

Conditions:
  HasApiImage: !Not [!Equals [!Ref ApiImage, '']]
  HasWebImage: !Not [!Equals [!Ref WebImage, '']]
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  UseHttps: !Not [!Equals [!Ref CertificateArn, '']]
  HasAgentCore: !Not [!Equals [!Ref AgentCoreRuntimeArn, '']]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 2, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 2, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Berry ALB, ports 80 and 443 from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: ALB to tasks
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-alb'

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Berry Fargate task, ALB only on 3000 and 4000
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: web from ALB
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: api from ALB
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Aurora IAM, ECR, S3, AgentCore
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-task'

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-artifacts'

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal:
              AWS: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub '${ArtifactsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  AppEnv:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: >-
        Berry API environment. BERRY_AUTH_SECRET is generated. Add GitHub OAuth
        and INTEGRATION_ENCRYPTION_KEY in the console; do not change this
        GenerateSecretString block on later updates or CloudFormation will
        replace the JSON.
      GenerateSecretString:
        SecretStringTemplate: '{"BERRY_AUTH_GITHUB_CLIENT_ID":"","BERRY_AUTH_GITHUB_CLIENT_SECRET":"","INTEGRATION_ENCRYPTION_KEY":""}'
        GenerateStringKey: BERRY_AUTH_SECRET
        PasswordLength: 64
        ExcludePunctuation: true
        RequireEachIncludedType: true

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }

  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/api'
      RetentionInDays: 30

  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}/web'
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Policies:
        - PolicyName: secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppEnv

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*'
      Policies:
        - PolicyName: berry-control-plane
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # RDS Signer is SigV4 locally; Autopilot does not see an RDS API call.
              - Sid: RdsIamAuth
                Effect: Allow
                Action:
                  - rds-db:connect
                Resource: !Sub 'arn:${AWS::Partition}:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${DbClusterResourceId}/${DatabaseUser}'
              # Autopilot s3:GetObject/PutObject/DeleteObject, scoped to this bucket.
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${ArtifactsBucket.Arn}/*'
              - !If
                - HasAgentCore
                - Sid: AgentCore
                  Effect: Allow
                  Action:
                    - bedrock-agentcore:CompleteResourceTokenAuth
                    - bedrock-agentcore:CreateEvent
                    - bedrock-agentcore:GetAgentRuntime
                    - bedrock-agentcore:GetResourceOauth2Token
                    - bedrock-agentcore:GetWorkloadAccessToken
                    - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                    - bedrock-agentcore:InvokeAgentRuntime
                    - bedrock-agentcore:InvokeAgentRuntimeCommand
                    - bedrock-agentcore:InvokeAgentRuntimeForUser
                    - bedrock-agentcore:ListEvents
                    - bedrock-agentcore:PassCapacityProvider
                    - bedrock-agentcore:StopRuntimeSession
                    - bedrock-agentcore:UpdateAgentRuntime
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:capacity-provider/*'
                    - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/*'
                    - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*'
                    - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/*'
                    - !Sub 'arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/*'
                - !Ref AWS::NoValue
              - !If
                - HasAgentCore
                - Sid: AgentCorePassRole
                  Effect: Allow
                  Action:
                    - iam:PassRole
                  Resource: '*'
                  Condition:
                    StringEquals:
                      iam:PassedToService: bedrock-agentcore.amazonaws.com
                - !Ref AWS::NoValue

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: VpcGatewayAttachment
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '4000'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-alb'

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 4000
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /ready
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200-399'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  HttpApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /api/*
            - /v1/*
            - /health
            - /ready
            - /readyz
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseHttps
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  HttpsApiRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: UseHttps
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /api/*
            - /v1/*
            - /health
            - /ready
            - /readyz
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-control-plane'
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: api
          Image: !If
            - HasApiImage
            - !Ref ApiImage
            - !Sub '${ApiRepository.RepositoryUri}:latest'
          Essential: true
          Command:
            - sh
            - -c
            - node --experimental-strip-types --no-warnings src/migrate/index.ts up && exec node --experimental-strip-types --no-warnings src/index.ts
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 10
            Retries: 3
            StartPeriod: 180
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
          Environment:
            - Name: APP_ENV
              Value: production
            - Name: API_ADDR
              Value: 0.0.0.0:4000
            - Name: AUTH_ALLOW_PASSWORDLESS_LOGIN
              Value: 'false'
            - Name: DATABASE_URL
              Value: !Ref DatabaseUrl
            - Name: DATABASE_IAM_AUTH
              Value: 'true'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: S3_BUCKET
              Value: !Ref ArtifactsBucket
            - Name: S3_REGION
              Value: !Ref AWS::Region
            - Name: S3_USE_PATH_STYLE
              Value: 'false'
            - Name: BERRY_PUBLIC_URL
              Value: !If
                - HasDomain
                - !If
                  - UseHttps
                  - !Sub 'https://${DomainName}'
                  - !Sub 'http://${DomainName}'
                - !If
                  - UseHttps
                  - !Sub 'https://${LoadBalancer.DNSName}'
                  - !Sub 'http://${LoadBalancer.DNSName}'
            - Name: BERRY_APP_URL
              Value: !If
                - HasDomain
                - !If
                  - UseHttps
                  - !Sub 'https://${DomainName}'
                  - !Sub 'http://${DomainName}'
                - !If
                  - UseHttps
                  - !Sub 'https://${LoadBalancer.DNSName}'
                  - !Sub 'http://${LoadBalancer.DNSName}'
            - Name: BERRY_TRUSTED_PROXIES
              Value: !Ref VpcCidr
            - Name: BERRY_AGENTCORE_RUNTIME_ARN
              Value: !Ref AgentCoreRuntimeArn
          Secrets:
            - Name: BERRY_AUTH_SECRET
              ValueFrom: !Sub '${AppEnv}:BERRY_AUTH_SECRET::'
            - Name: BERRY_AUTH_GITHUB_CLIENT_ID
              ValueFrom: !Sub '${AppEnv}:BERRY_AUTH_GITHUB_CLIENT_ID::'
            - Name: BERRY_AUTH_GITHUB_CLIENT_SECRET
              ValueFrom: !Sub '${AppEnv}:BERRY_AUTH_GITHUB_CLIENT_SECRET::'
            - Name: INTEGRATION_ENCRYPTION_KEY
              ValueFrom: !Sub '${AppEnv}:INTEGRATION_ENCRYPTION_KEY::'
        - Name: web
          Image: !If
            - HasWebImage
            - !Ref WebImage
            - !Sub '${WebRepository.RepositoryUri}:latest'
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 10
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web
          Environment:
            - Name: HOSTNAME
              Value: 0.0.0.0
            - Name: PORT
              Value: '3000'
            - Name: BERRY_API_ORIGIN
              Value: http://127.0.0.1:4000

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
      - HttpApiRule
    Properties:
      ServiceName: !Sub '${AWS::StackName}-control-plane'
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 180
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
      TaskDefinition: !Ref TaskDefinition
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 4000
          TargetGroupArn: !Ref ApiTargetGroup
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref WebTargetGroup

Outputs:
  Url:
    Description: Browser origin for this stack
    Value: !If
      - HasDomain
      - !If
        - UseHttps
        - !Sub 'https://${DomainName}'
        - !Sub 'http://${DomainName}'
      - !If
        - UseHttps
        - !Sub 'https://${LoadBalancer.DNSName}'
        - !Sub 'http://${LoadBalancer.DNSName}'

  LoadBalancerDns:
    Description: ALB DNS name
    Value: !GetAtt LoadBalancer.DNSName

  ApiRepositoryUri:
    Description: Push the API image here when ApiImage is empty
    Value: !GetAtt ApiRepository.RepositoryUri

  WebRepositoryUri:
    Description: Push the web image here when WebImage is empty
    Value: !GetAtt WebRepository.RepositoryUri

  ArtifactsBucketName:
    Description: S3 bucket for run artifacts (retained on stack delete)
    Value: !Ref ArtifactsBucket

  AppEnvSecretArn:
    Description: Add GitHub OAuth and INTEGRATION_ENCRYPTION_KEY in the Secrets Manager console
    Value: !Ref AppEnv

  ClusterName:
    Value: !Ref Cluster

  ServiceName:
    Value: !GetAtt Service.Name

  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
