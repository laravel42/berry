# Berry in Docker: one file, two ways to run it. deploy/docker/README.md has the detail.
#
#   Self-host (Dokploy, or any Docker host): the services without a profile.
#      docker compose up -d --build
#      Variables: deploy/docker/self-host.env.example. In Dokploy, the compose
#      path is `compose.yaml` and the Environment tab holds them.
#
#         browser ─ Traefik ─┬─ <domain> ─────────────── web :3000 ── /api, /v1 ──┐
#                            └─ p-….<preview domain> ───────────────────────────── api :4000
#                                             sessions :8080 ← api      postgres :5432
#
#   Local development: the `dev` profile, from the working tree with watchers on.
#      bun run dev:docker     Ctrl+C stops it; bun run dev:docker:down removes it
#      dev-web http://localhost:3000, dev-api http://localhost:4000,
#      dev-sessions http://localhost:8080, dev-postgres inside the network.
#      It reads the repository's .env, except DATABASE_URL.
#
# The AWS host is not here: the CDK stack ships deploy/aws/host/compose.yml to
# it, with prebuilt images and the host's network.
#
# In both stacks the API starts a preview's containers and the session router
# one container per agent session, through the host's Docker socket. Those are
# siblings of these containers, not children, so they are published on an
# address both sides reach: the Docker bridge on a server, the Mac's loopback
# (through host.docker.internal) in development.

x-logging: &logging
   driver: json-file
   options: { max-size: '20m', max-file: '5' }

# Reached by the bridge's address, not by `host.docker.internal`: the address
# becomes the Host header a preview's server sees, and dev servers (Vite, and
# others that check it) accept any IP address and refuse a name they do not know.
x-docker-host: &docker-host
   BERRY_DOCKER_PUBLISH_ADDR: ${DOCKER_BRIDGE_ADDR:-172.17.0.1}
   BERRY_DOCKER_HOST_ADDR: ${DOCKER_BRIDGE_ADDR:-172.17.0.1}

x-dev: &dev
   profiles: [dev]
   build:
      context: deploy/docker
      dockerfile: dev.Dockerfile
   env_file:
      - path: .env
        required: false
   extra_hosts:
      - 'host.docker.internal:host-gateway'
   init: true
   environment: &dev-env
      # Bun's download cache, in a volume, so a reinstall does not fetch again.
      BUN_INSTALL_CACHE_DIR: /bun-cache

# Every dev service sees the same installs. They are volumes rather than the
# working tree's node_modules because some packages ship per-platform binaries,
# and only `dev-install` writes them.
x-dev-modules: &dev-modules
   - .:/repo
   - root-modules:/repo/node_modules
   - server-modules:/repo/server-ts/node_modules
   - web-modules:/repo/frontend/node_modules
   - sdk-modules:/repo/packages/plugin-sdk/node_modules
   - marketing-modules:/repo/apps/web/node_modules
   - bun-cache:/bun-cache

services:
   # ── Self-host ────────────────────────────────────────────────────────────

   # Fails the deploy, naming what is missing, before anything starts without
   # it. A check in each variable's place (`${X:?}`) would also stop
   # `bun run dev:docker`, which interpolates this whole file and sets none of them.
   preflight:
      image: busybox:1.36
      restart: 'no'
      network_mode: none
      environment:
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
         BERRY_DOMAIN: ${BERRY_DOMAIN:-}
         BERRY_AUTH_SECRET: ${BERRY_AUTH_SECRET:-}
         INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
         BERRY_RUNTIME_AUTH_TOKEN: ${BERRY_RUNTIME_AUTH_TOKEN:-}
         BERRY_PREVIEW_DOMAIN: ${BERRY_PREVIEW_DOMAIN:-}
         BERRY_PREVIEW_DOMAIN_REGEX: ${BERRY_PREVIEW_DOMAIN_REGEX:-}
      command:
         - sh
         - -c
         - >-
           missing="";
           for name in POSTGRES_PASSWORD BERRY_DOMAIN BERRY_AUTH_SECRET INTEGRATION_ENCRYPTION_KEY
           BERRY_RUNTIME_AUTH_TOKEN BERRY_PREVIEW_DOMAIN BERRY_PREVIEW_DOMAIN_REGEX;
           do [ -n "$$(printenv $$name)" ] || missing="$$missing $$name"; done;
           [ -z "$$missing" ] || { echo "Set these variables (deploy/docker/self-host.env.example):$$missing" >&2; exit 1; }

   postgres:
      image: postgres:16
      restart: unless-stopped
      environment:
         POSTGRES_USER: berry
         POSTGRES_DB: berry
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      volumes:
         - berry-postgres:/var/lib/postgresql/data
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U berry -d berry']
         interval: 5s
         timeout: 3s
         retries: 20
      depends_on:
         preflight: { condition: service_completed_successfully }
      networks: [berry]
      logging: *logging

   api:
      build:
         context: .
         dockerfile: deploy/docker/api.Dockerfile
      restart: unless-stopped
      environment:
         <<: *docker-host
         APP_ENV: production
         SERVICE_NAME: berry-server
         HOME: /root
         DATABASE_URL: postgres://berry:${POSTGRES_PASSWORD:-}@postgres:5432/berry?sslmode=disable
         BERRY_APP_URL: ${BERRY_SCHEME:-http}://${BERRY_DOMAIN:-}
         BERRY_PUBLIC_URL: ${BERRY_SCHEME:-http}://${BERRY_DOMAIN:-}
         # An agent session calls the API back. It is a container beside these, so it goes through the host like everything else.
         BERRY_RUNTIME_CALLBACK_URL: ${BERRY_RUNTIME_CALLBACK_URL:-${BERRY_SCHEME:-http}://${BERRY_DOMAIN:-}}
         BERRY_AUTH_SECRET: ${BERRY_AUTH_SECRET:-}
         INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
         BERRY_AUTH_GITHUB_CLIENT_ID: ${BERRY_AUTH_GITHUB_CLIENT_ID:-}
         BERRY_AUTH_GITHUB_CLIENT_SECRET: ${BERRY_AUTH_GITHUB_CLIENT_SECRET:-}
         BERRY_GITHUB_WEBHOOK_SECRET: ${BERRY_GITHUB_WEBHOOK_SECRET:-}
         SESSION_TTL: ${SESSION_TTL:-}
         # Outbound mail: magic links, password resets, two-factor codes.
         # BERRY_MAIL_PROVIDER=cloudflare fills the SMTP host and port; an
         # explicit BERRY_SMTP_URL or BERRY_SMTP_HOST wins.
         BERRY_MAIL_PROVIDER: ${BERRY_MAIL_PROVIDER:-}
         BERRY_MAIL_FROM: ${BERRY_MAIL_FROM:-}
         BERRY_SMTP_URL: ${BERRY_SMTP_URL:-}
         BERRY_SMTP_HOST: ${BERRY_SMTP_HOST:-}
         BERRY_SMTP_PORT: ${BERRY_SMTP_PORT:-587}
         BERRY_SMTP_SECURE: ${BERRY_SMTP_SECURE:-}
         BERRY_SMTP_USER: ${BERRY_SMTP_USER:-}
         BERRY_SMTP_PASS: ${BERRY_SMTP_PASS:-}
         # Plugin OAuth (Connect) for hosts without dynamic client registration.
         GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
         GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
         # Voice rooms: all three of URL, key and secret, or none.
         LIVEKIT_URL: ${LIVEKIT_URL:-}
         LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
         LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
         LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-}
         # Agent runs: the session router beside this service, unless
         # BERRY_AGENTCORE_RUNTIME_ARN is set, which takes precedence.
         BERRY_AGENT_RUNTIME_URL: http://sessions:8080
         BERRY_RUNTIME_AUTH_TOKEN: ${BERRY_RUNTIME_AUTH_TOKEN:-}
         BERRY_BEDROCK_REGION: ${BERRY_BEDROCK_REGION:-us-east-1}
         BERRY_BEDROCK_ACCESS_KEY_ID: ${BERRY_BEDROCK_ACCESS_KEY_ID:-}
         BERRY_BEDROCK_SECRET_ACCESS_KEY: ${BERRY_BEDROCK_SECRET_ACCESS_KEY:-}
         BERRY_AGENT_DEFAULT_MODEL: ${BERRY_AGENT_DEFAULT_MODEL:-}
         BERRY_RUN_CONCURRENCY: ${BERRY_RUN_CONCURRENCY:-2}
         # Optional: runs on a deployed AgentCore Runtime instead of the
         # sessions container (server-ts/sandbox/agentcore/deploy.sh prints the
         # ARN). AgentCore calls back on BERRY_RUNTIME_CALLBACK_URL, so that
         # must be public. Keys unset fall back to BERRY_BEDROCK_*, then to the
         # AWS default chain (an instance role).
         BERRY_AGENTCORE_RUNTIME_ARN: ${BERRY_AGENTCORE_RUNTIME_ARN:-}
         BERRY_AGENTCORE_REGION: ${BERRY_AGENTCORE_REGION:-}
         BERRY_AGENTCORE_ACCESS_KEY_ID: ${BERRY_AGENTCORE_ACCESS_KEY_ID:-}
         BERRY_AGENTCORE_SECRET_ACCESS_KEY: ${BERRY_AGENTCORE_SECRET_ACCESS_KEY:-}
         BERRY_AGENTCORE_SESSION_TOKEN: ${BERRY_AGENTCORE_SESSION_TOKEN:-}
         # Optional: AgentCore Memory for cross-run recall.
         BERRY_AGENTCORE_MEMORY_ID: ${BERRY_AGENTCORE_MEMORY_ID:-}
         # Previews, each at p-<id>-<app>.<preview domain>.
         BERRY_PREVIEW_DOMAIN: ${BERRY_PREVIEW_DOMAIN:-}
         BERRY_PREVIEW_SCHEME: ${BERRY_SCHEME:-http}
         BERRY_PREVIEW_PORT: default
         BERRY_PREVIEW_ROOT: /var/lib/berry/previews
         # Run artifacts. Empty leaves file storage off; any S3-compatible store works with S3_ENDPOINT.
         S3_BUCKET: ${S3_BUCKET:-}
         S3_REGION: ${S3_REGION:-}
         S3_ENDPOINT: ${S3_ENDPOINT:-}
         S3_USE_PATH_STYLE: ${S3_USE_PATH_STYLE:-}
         AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
         AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      volumes:
         - /var/run/docker.sock:/var/run/docker.sock
         # A preview's checkout is mounted into its containers by the host's
         # Docker, so it must be at the same path on the host as in here.
         - /var/lib/berry/previews:/var/lib/berry/previews
      extra_hosts:
         - 'host.docker.internal:host-gateway'
      depends_on:
         postgres: { condition: service_healthy }
      networks: [berry, dokploy-network]
      labels:
         # Previews are addressed by a pattern, which Dokploy's Domains tab
         # cannot express, so their route is written here. The app's own domain
         # is added in the Domains tab, on the `web` service.
         - traefik.enable=true
         - traefik.docker.network=dokploy-network
         - traefik.http.routers.berry-previews.rule=HostRegexp(`^p-[0-9a-f]{20}(-[a-z][a-z0-9-]*)?\.${BERRY_PREVIEW_DOMAIN_REGEX:-}$$`)
         # Traefik's plain entrypoint: behind a Cloudflare tunnel TLS ends at
         # Cloudflare and the tunnel speaks HTTP to Traefik, and on a private
         # network there is no TLS at all. Only when Traefik itself must serve
         # HTTPS: change `web` to `websecure` and add the two tls lines (README).
         - traefik.http.routers.berry-previews.entrypoints=web
         # - traefik.http.routers.berry-previews.tls=true
         # - traefik.http.routers.berry-previews.tls.certresolver=letsencrypt-dns
         - traefik.http.routers.berry-previews.service=berry-previews
         - traefik.http.services.berry-previews.loadbalancer.server.port=4000
      logging: *logging

   # One container per agent session, each with its own folder, memory, CPU and
   # process ceiling; idle ones are stopped. What `bun run runtime:sessions` runs.
   sessions:
      build:
         context: .
         dockerfile: deploy/docker/api.Dockerfile
      restart: unless-stopped
      # The sessions get what the runtime reads and nothing of the API's: the
      # file the router hands to `docker run --env-file` is written from this
      # service's own environment, which holds nothing else.
      command:
         - sh
         - -c
         - >-
           umask 077 &&
           printenv | grep -E '^(BERRY_BEDROCK_|BERRY_AGENTCORE_|AWS_REGION=|BERRY_RUNTIME_AUTH_TOKEN=)' > /run/runtime.env &&
           exec node --experimental-strip-types --no-warnings src/runtime/local-router/main.ts
      environment:
         <<: *docker-host
         BERRY_ROUTER_ENV_FILE: /run/runtime.env
         BERRY_ROUTER_IMAGE: berry-agent-runtime
         BERRY_ROUTER_LISTEN_HOST: 0.0.0.0
         BERRY_RUNTIME_PORT: '8080'
         BERRY_ROUTER_MAX_CONTAINERS: ${BERRY_ROUTER_MAX_CONTAINERS:-8}
         BERRY_RUNTIME_AUTH_TOKEN: ${BERRY_RUNTIME_AUTH_TOKEN:-}
         BERRY_BEDROCK_REGION: ${BERRY_BEDROCK_REGION:-us-east-1}
         AWS_REGION: ${BERRY_BEDROCK_REGION:-us-east-1}
         BERRY_BEDROCK_ACCESS_KEY_ID: ${BERRY_BEDROCK_ACCESS_KEY_ID:-}
         BERRY_BEDROCK_SECRET_ACCESS_KEY: ${BERRY_BEDROCK_SECRET_ACCESS_KEY:-}
      volumes:
         - /var/run/docker.sock:/var/run/docker.sock
      extra_hosts:
         - 'host.docker.internal:host-gateway'
      depends_on: [runtime-image]
      networks: [berry]
      logging: *logging

   # Not a service: it exists so that a deploy builds the image the router
   # starts sessions from, under the name the router looks for, and exits.
   runtime-image:
      build:
         context: server-ts
         dockerfile: sandbox/agentcore/Dockerfile
         args:
            # The image defaults to arm64, which is what AgentCore runs. Here it
            # runs on this server: amd64 unless the server is an ARM machine.
            BERRY_RUNTIME_PLATFORM: ${BERRY_RUNTIME_PLATFORM:-linux/amd64}
      image: berry-agent-runtime
      entrypoint: ['true']
      restart: 'no'
      network_mode: none

   web:
      build:
         context: .
         dockerfile: deploy/docker/web.Dockerfile
         args:
            BERRY_API_ORIGIN: http://api:4000
      restart: unless-stopped
      depends_on: [api]
      networks: [berry, dokploy-network]
      logging: *logging

   # ── Local development (profile `dev`) ────────────────────────────────────

   dev-postgres:
      profiles: [dev]
      image: postgres:16
      environment:
         POSTGRES_USER: berry
         POSTGRES_DB: berry
         POSTGRES_PASSWORD: berry
      volumes:
         - postgres:/var/lib/postgresql/data
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U berry -d berry']
         interval: 5s
         timeout: 3s
         retries: 20

   # Installs the server's and the web app's dependencies once, then exits.
   dev-install:
      <<: *dev
      command: ['bash', 'deploy/docker/dev-start.sh', 'install']
      restart: 'no'
      volumes: *dev-modules

   dev-api:
      <<: *dev
      command: ['bash', 'deploy/docker/dev-start.sh', 'api']
      environment:
         <<: *dev-env
         API_ADDR: 0.0.0.0:4000
         HOME: /root
         # Overrides .env so this stack does not share the Mac's database.
         DATABASE_URL: postgres://berry:berry@dev-postgres:5432/berry?sslmode=disable
         BERRY_AGENT_RUNTIME_URL: http://dev-sessions:8080
         # A preview's checkout is mounted into its containers by the Mac's
         # Docker, so it has to be at the same path in here as it is out there.
         BERRY_PREVIEW_ROOT: ${HOME}/.cache/berry/previews
      ports:
         - '127.0.0.1:4000:4000'
      volumes:
         - .:/repo
         - root-modules:/repo/node_modules
         - server-modules:/repo/server-ts/node_modules
         - /var/run/docker.sock:/var/run/docker.sock
         - ${HOME}/.cache/berry/previews:${HOME}/.cache/berry/previews
      depends_on:
         dev-install: { condition: service_completed_successfully }
         dev-postgres: { condition: service_healthy }
         dev-sessions: { condition: service_started }

   dev-sessions:
      <<: *dev
      command: ['bash', 'deploy/docker/dev-start.sh', 'sessions']
      environment:
         <<: *dev-env
         BERRY_ROUTER_IMAGE: berry-agent-runtime
         BERRY_ROUTER_LISTEN_HOST: 0.0.0.0
         BERRY_RUNTIME_PORT: '8080'
      ports:
         # Also on the host at localhost:8080. dev-api uses http://dev-sessions:8080.
         - '127.0.0.1:8080:8080'
      volumes:
         - .:/repo
         - /var/run/docker.sock:/var/run/docker.sock
      depends_on:
         dev-runtime-image: { condition: service_completed_successfully }

   # Builds the agent runtime image for this machine and exits, like
   # `runtime-image`, with the development default for the processor.
   dev-runtime-image:
      profiles: [dev]
      build:
         context: server-ts
         dockerfile: sandbox/agentcore/Dockerfile
         args:
            # arm64 is an Apple Silicon Mac. Intel Mac or x86 Linux: BERRY_RUNTIME_PLATFORM=linux/amd64 bun run dev:docker
            BERRY_RUNTIME_PLATFORM: ${BERRY_RUNTIME_PLATFORM:-linux/arm64}
      image: berry-agent-runtime
      entrypoint: ['true']
      restart: 'no'
      network_mode: none

   dev-web:
      <<: *dev
      command: ['bash', 'deploy/docker/dev-start.sh', 'web']
      environment:
         <<: *dev-env
         BERRY_API_ORIGIN: http://dev-api:4000
         # Its own build folder: the Mac's .next holds files built for macOS.
         NEXT_DIST_DIR: .next-docker
         NEXT_TELEMETRY_DISABLED: '1'
      ports:
         - '127.0.0.1:3000:3000'
      volumes: *dev-modules
      depends_on:
         dev-install: { condition: service_completed_successfully }
         dev-api: { condition: service_started }

volumes:
   # Self-host's database.
   berry-postgres:
   # Development: the database and the per-platform installs. The database
   # volume keeps deploy/local's name, so an existing dev stack keeps its data.
   postgres:
   bun-cache:
   server-modules:
   root-modules:
   web-modules:
   sdk-modules:
   marketing-modules:

networks:
   berry:
   dokploy-network:
      external: true
