# Standalone install for deploy/local/start.sh. Isolates this folder from the
# repo-root workspace so the API container does not install the frontend.
packages:
   - .
strictDepBuilds: false
allowBuilds:
   better-sqlite3: true
   koffi: true
   node-llama-cpp: true
   tree-sitter-go: true
   tree-sitter-javascript: true
   tree-sitter-python: true
   tree-sitter-rust: true
   tree-sitter-typescript: true

# GHSA-jqcg-44mw-7w3h: express pulled proxy-addr before 2.0.8.
# GHSA-x6jw-m9v5-85vh / GHSA-v5rq-49vh-5v5c: node-llama-cpp pulled simple-git 3.
overrides:
   proxy-addr: 2.0.8
   simple-git: 4.0.1
   '@simple-git/argv-parser': 2.0.1
   # GHSA-27r3-jxmh-p828: express resolved body-parser 2.3.0.
   body-parser: 2.4.0
