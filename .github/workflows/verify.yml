name: Verify

on:
   push:
      branches: [main]
   pull_request:

permissions:
   contents: read

concurrency:
   group: verify-${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   server:
      runs-on: ubuntu-latest
      timeout-minutes: 20
      services:
         postgres:
            image: postgres:16
            env:
               POSTGRES_USER: berry
               POSTGRES_PASSWORD: berry_ci_only
               POSTGRES_DB: berry_test
               POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
            ports:
               - 5432:5432
            options: >-
               --health-cmd "pg_isready -U berry -d berry_test"
               --health-interval 5s
               --health-timeout 5s
               --health-retries 10
      env:
         APP_ENV: test
         DATABASE_URL: postgres://berry:berry_ci_only@127.0.0.1:5432/berry_test
         BERRY_TEST_DATABASE_URL: postgres://berry:berry_ci_only@127.0.0.1:5432/berry_test
      steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
           with:
              node-version: 22
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - run: bun install --frozen-lockfile --ignore-scripts
         - run: bun run db:migrate
         - run: bun run typecheck:server
         - run: bun run test:server
         - run: bun run test:plugin-sdk && bun run typecheck:plugin-sdk
         - run: bun run check:models
         - run: python3 scripts/check-locale-catalogues.py

   frontend:
      runs-on: ubuntu-latest
      timeout-minutes: 20
      env:
         NEXT_TELEMETRY_DISABLED: 1
      steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
           with:
              node-version: 22
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - run: bun install --frozen-lockfile --ignore-scripts
         # The build renders the marketing site first, from its own install.
         - run: bun install --frozen-lockfile --ignore-scripts
           working-directory: apps/web
         - run: bun run lint
           working-directory: frontend
         - run: bun run build:check
           working-directory: frontend
